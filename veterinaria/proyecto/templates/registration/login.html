<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | ZenithVet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-zenith {
            background: radial-gradient(circle at top right, #1e40af, #0f172a);
        }
    </style>
</head>
<body class="bg-zenith min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Círculos decorativos animados de fondo -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
    </div>

    <div class="max-w-md w-full relative z-10 fade-in-up">
        
        <!-- Contenedor Principal -->
        <div class="glass-card rounded-[2.5rem] shadow-2xl p-10">
            
            <!-- Logo y Encabezado -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg shadow-blue-500/30 mb-6 transform hover:rotate-12 transition-transform duration-300">
                    <i class="fas fa-paw text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Bienvenido</h2>
                <p class="text-slate-500 mt-2 font-medium text-sm">Accede al panel administrativo de tu clínica</p>
            </div>

            <!-- Formulario de Django -->
            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <!-- Usuario -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-700 uppercase tracking-widest ml-1">Usuario</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-colors">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" name="username" required
                            class="block w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all placeholder:text-slate-400"
                            placeholder="Nombre de usuario">
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="text-xs font-black text-slate-700 uppercase tracking-widest">Contraseña</label>
                        <a href="#" class="text-xs font-bold text-blue-600 hover:text-blue-700 transition">¿Olvidaste tu clave?</a>
                    </div>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-colors">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" required
                            class="block w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all placeholder:text-slate-400"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Recordarme (Opcional) -->
                <div class="flex items-center ml-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                    <label for="remember" class="ml-2 text-xs font-medium text-slate-500">Recordar sesión</label>
                </div>

                <!-- Botón Enviar -->
                <button type="submit" 
                    class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-slate-900/20 transition-all duration-300 transform hover:-translate-y-1 mt-4 active:scale-95">
                    Iniciar Sesión <i class="fas fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>

            <!-- Footer con enlaces -->
            <div class="mt-10 text-center border-t border-slate-100 pt-8">
                <p class="text-slate-500 text-sm font-medium">
                    ¿No tienes cuenta? 
                    <a href="{% url 'registro' %}" class="text-blue-600 font-bold hover:underline ml-1">Registra tu clínica</a>
                </p>
            </div>
        </div>

        <!-- Botón Volver -->
        <div class="text-center mt-8">
            <a href="/" class="text-slate-400 hover:text-blue-200 text-sm font-medium transition-colors inline-flex items-center space-x-2">
                <i class="fas fa-house-user text-xs"></i>
                <span>Volver a la página principal</span>
            </a>
        </div>
    </div>

</body>
</html>
